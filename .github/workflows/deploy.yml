name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
  verify:
    name: Verify published revision and routes
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_REVISION: ${{ github.sha }}
      TEST_RUN_ID: hosted-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check public identity before and after route checks
        run: node scripts/verify.mjs --release --checks=hosted --target=https://and-gu.github.io/executable-engineering-lab/
      - name: Retain hosted verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: hosted-verification-${{ github.sha }}
          path: artifacts/runs/${{ env.TEST_RUN_ID }}/
          if-no-files-found: error
          retention-days: 30
